name: Feature request
description: Suggest an improvement to ExecDeck.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe a workflow or example if you can.
    validations:
      required: true
