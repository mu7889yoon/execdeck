name: execdeck

services:
  sandbox:
    build:
      context: ./microvm
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      TERMINAL_PORT: 8081
      WORKSPACE_ROOT: ${EXECDECK_WORKSPACE_ROOT:-/workspace}
      WORKSHOP_MODE: local
    volumes:
      - "workshop_workspace:${EXECDECK_WORKSPACE_ROOT:-/workspace}"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  slides:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      WORKSHOP_API_TARGET: http://sandbox:8080
      WORKSHOP_TERMINAL_TARGET: ws://sandbox:8081
    volumes:
      - ./slides:/app
      - slidev_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3030:3030"
    depends_on:
      - sandbox

volumes:
  slidev_node_modules:
  workshop_workspace:
